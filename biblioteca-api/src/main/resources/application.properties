spring.application.name=biblioteca

# --- Conexión a MySQL en la propia instancia (interfaz de bucle local) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/biblioteca
spring.datasource.username=${BIBLIOTECA_DB_USER:biblioteca_app}
# La contraseña NUNCA va aquí: llega por variable de entorno
spring.datasource.password=${BIBLIOTECA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Si MySQL no responde, fallar en 3 s (y devolver 503) en vez de esperar 30 s
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never

# --- Parámetros de negocio (se sobrescriben con BIBLIOTECA_ALUMNO, BIBLIOTECA_PRESTAMO_MAXIMO...) ---
biblioteca.alumno=sin-asignar
biblioteca.prestamo.maximo=3
biblioteca.prestamo.dias=14
